spring.application.name=Branded-App

# Supabase Ireland Session Pooler
spring.datasource.url=jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.vxwruucgayivwfdrvuzs
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000


# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# Server Settings
server.address=0.0.0.0
server.port=${PORT:10000}

# Email (Resend)
resend.api.key=${RESEND_API_KEY}
itemhive.mail.from=onboarding@resend.dev

# Frontend URL used in the email verification link
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
