spring.application.name=Branded-App

# Supabase Ireland Session Pooler
spring.datasource.url=jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.vxwruucgayivwfdrvuzs
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server Settings
server.address=0.0.0.0
server.port=${PORT:10000}

# Email (Gmail SMTP Setup)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=itemhive.noreply@gmail.com
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

itemhive.mail.from=itemhive.noreply@gmail.com

# Frontend URL
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# JWT Security Configuration
jwt.secret=${JWT_SECRET}
