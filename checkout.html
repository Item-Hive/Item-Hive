<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ICT Branded – Checkout</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy:   #101D56;
      --orange: #FF751F;
      --teal:   #0097B2;
      --grey:   #f4f6fb;
      --border: #dde2f0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Source Sans 3', sans-serif;
      background: var(--grey);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* ── NAV ── */
    nav {
      background: var(--navy);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 28px;
      position: sticky; top: 0; z-index: 10;
    }
    .nav-logo { font-size: 18px; font-weight: 900; color: #fff; }
    .nav-logo span { color: var(--orange); }
    .nav-back {
      color: var(--teal);
      font-size: 13px;
      font-weight: 700;
      border: 1.5px solid var(--teal);
      border-radius: 7px;
      padding: 5px 14px;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      transition: background .2s, color .2s;
      text-decoration: none;
    }
    .nav-back:hover { background: var(--teal); color: #fff; }
    .nav-title { color: #fff; font-size: 16px; font-weight: 700; }

    /* ── PAGE ── */
    .page { max-width: 620px; margin: 0 auto; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 14px; }

    /* ── STUDENT BANNER ── */
    .student-banner {
      background: linear-gradient(90deg, var(--navy), var(--teal));
      border-radius: 12px;
      padding: 13px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
    }
    .banner-badge {
      background: var(--orange);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      border-radius: 8px;
      padding: 4px 12px;
      flex-shrink: 0;
      letter-spacing: .5px;
    }

    /* ── CARD ── */
    .card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 2px 10px rgba(16,29,86,.05);
    }
    .card-head {
      background: var(--navy);
      color: #fff;
      padding: 10px 18px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .card-body { padding: 14px 18px; }

    /* ── ORDER ITEMS ── */
    .order-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--grey);
      gap: 10px;
    }
    .order-item:last-child { border-bottom: none; }
    .item-left { display: flex; align-items: center; flex: 1; min-width: 0; }
    .item-dot {
      width: 38px; height: 38px;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-right: 13px;
      font-size: 18px;
    }
    .item-dot.navy   { background: var(--navy); }
    .item-dot.teal   { background: var(--teal); }
    .item-dot.orange { background: var(--orange); }
    .item-dot.light  { background: #e8eaf2; }
    .item-name { font-size: 14px; font-weight: 700; color: var(--navy); }
    .item-sub { font-size: 12px; color: #8892aa; margin-top: 2px; }
    .item-price { font-size: 15px; font-weight: 900; color: var(--navy); width: 64px; text-align: right; flex-shrink: 0; }

    .qty-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .qty-btn {
      width: 22px; height: 22px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--navy);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      padding: 0; line-height: 1;
      font-family: inherit;
    }
    .qty-btn:hover { border-color: var(--teal); }
    .qty-val { font-size: 13px; font-weight: 700; color: var(--navy); min-width: 16px; text-align: center; }
    .remove-btn {
      background: none;
      border: none;
      color: #c33;
      font-size: 18px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      flex-shrink: 0;
    }

    /* ── DELIVERY ── */
    .del-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .del-opt {
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .del-opt.active { border-color: var(--teal); background: #e6f6fa; }
    .del-opt:hover { border-color: var(--teal); }
    .del-name { font-size: 13px; font-weight: 700; color: var(--navy); }
    .del-desc { font-size: 11px; color: #8892aa; margin-top: 2px; }
    .del-price { font-size: 13px; font-weight: 700; color: var(--teal); margin-top: 6px; }

    /* ── PAYMENT ── */
    .pay-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .pay-opt {
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 9px 20px;
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
      cursor: pointer;
      background: #fff;
      font-family: inherit;
      transition: border-color .15s, color .15s, background .15s;
    }
    .pay-opt.active { border-color: var(--orange); color: var(--orange); background: #fff8f3; }
    .pay-opt:hover { border-color: var(--orange); }

    /* ── TOTALS ── */
    .total-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      font-size: 14px;
      color: #556;
      border-bottom: 1px solid var(--grey);
    }
    .total-row:last-child { border-bottom: none; }
    .total-row.discount { color: var(--teal); font-weight: 700; }
    .total-row.final {
      font-size: 18px;
      font-weight: 900;
      color: var(--navy);
      padding-top: 12px;
    }
    .disc-badge {
      background: var(--orange);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      border-radius: 20px;
      padding: 2px 9px;
      margin-left: 8px;
    }

    /* ── ORDER BUTTON ── */
    .order-btn {
      width: 100%;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 900;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: .4px;
      transition: background .2s, transform .1s;
      box-shadow: 0 6px 20px rgba(255,117,31,.3);
    }
    .order-btn:hover { background: #e5651a; }
    .order-btn:active { transform: scale(.98); }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 60px 16px;
    }
    .empty-emoji { font-size: 40px; margin-bottom: 10px; }
    .empty-title { font-size: 16px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
    .empty-sub { font-size: 13px; color: #8892aa; margin-bottom: 20px; }
    .empty-btn {
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    /* ── CONFIRMATION ── */
    .confirm-card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 32px 20px;
      text-align: center;
    }
    .confirm-emoji { font-size: 36px; margin-bottom: 8px; }
    .confirm-title { font-size: 18px; font-weight: 900; color: var(--navy); margin-bottom: 6px; }
    .confirm-detail { font-size: 14px; color: #556; }
    .confirm-detail strong { color: var(--navy); }
    .confirm-btn {
      margin-top: 20px;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-back" href="products.html">← Back</a>
    <span class="nav-title">Checkout</span>
    <span class="nav-logo">ICT <span>Branded</span></span>
  </nav>

  <div class="page" id="page-content">
    <!-- populated by JS -->
  </div>

  <script>
    // ── PRODUCT CATALOG (must match products.html) ──
    const CATALOG = {
      crop:      { name: "ICT Crop",      sub: "Women's Fit",       price: 130, emoji: "👚", bg: "teal"   },
      classic:   { name: "ICT Classic",   sub: "Unisex",             price: 150, emoji: "👕", bg: "navy"   },
      custom:    { name: "Custom Print",  sub: "Name + Language",    price: 200, emoji: "🖨️", bg: "orange" },
      oversized: { name: "ICT Oversized", sub: "Unisex",             price: 180, emoji: "🧥", bg: "light"  }
    };

    const CART_KEY = "ict_branded_cart";
    const DISCOUNT = 0.2;

    let state = {
      delivery: "pickup",
      payment: "YOCO",
      confirmation: null // { total, payment } once order is placed
    };

    function loadCart() {
      try {
        const raw = localStorage.getItem(CART_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    function saveCart(cart) {
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
    }

    function money(n) {
      return "R" + (n % 1 === 0 ? n : n.toFixed(2));
    }

    function getItems() {
      const cart = loadCart();
      return Object.keys(cart)
        .filter(id => cart[id] > 0 && CATALOG[id])
        .map(id => {
          const p = CATALOG[id];
          const qty = cart[id];
          return {
            id, qty,
            name: p.name, sub: p.sub, emoji: p.emoji, bg: p.bg,
            price: p.price,
            origLineTotal: p.price * qty,
            lineTotal: Math.round(p.price * (1 - DISCOUNT)) * qty
          };
        });
    }

    function updateQty(id, qty) {
      const cart = loadCart();
      if (qty <= 0) {
        delete cart[id];
      } else {
        cart[id] = qty;
      }
      saveCart(cart);
      render();
    }

    function removeItem(id) {
      const cart = loadCart();
      delete cart[id];
      saveCart(cart);
      render();
    }

    function setDelivery(key) {
      state.delivery = key;
      render();
    }

    function setPayment(key) {
      state.payment = key;
      render();
    }

    function placeOrder() {
      const items = getItems();
      const subtotal = items.reduce((s, i) => s + i.origLineTotal, 0);
      const discountAmount = Math.round(subtotal * DISCOUNT);
      const total = subtotal - discountAmount;

      state.confirmation = { total, payment: state.payment };
      saveCart({}); // clear the shared cart
      render();
    }

    function goToProducts() {
      window.location.href = "products.html";
    }

    function render() {
      const container = document.getElementById('page-content');
      const items = getItems();

      // ── Confirmation view ──
      if (state.confirmation) {
        container.innerHTML = `
          <div class="confirm-card">
            <div class="confirm-emoji">🎉</div>
            <div class="confirm-title">Order placed!</div>
            <div class="confirm-detail">Total charged: <strong>${money(state.confirmation.total)}</strong> via ${state.confirmation.payment}</div>
            <button class="confirm-btn" onclick="goToProducts()">Continue shopping</button>
          </div>
        `;
        return;
      }

      // ── Empty cart view ──
      if (items.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-emoji">🛒</div>
            <div class="empty-title">Your cart is empty</div>
            <div class="empty-sub">Add something from the shop first.</div>
            <button class="empty-btn" onclick="goToProducts()">Browse products</button>
          </div>
        `;
        return;
      }

      const subtotal = items.reduce((s, i) => s + i.origLineTotal, 0);
      const discountAmount = Math.round(subtotal * DISCOUNT);
      const total = subtotal - discountAmount;

      const orderItemsHTML = items.map(item => `
        <div class="order-item">
          <div class="item-left">
            <div class="item-dot ${item.bg}">${item.emoji}</div>
            <div>
              <div class="item-name">${item.name}</div>
              <div class="item-sub">${item.sub}</div>
            </div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="updateQty('${item.id}', ${item.qty - 1})">−</button>
            <span class="qty-val">${item.qty}</span>
            <button class="qty-btn" onclick="updateQty('${item.id}', ${item.qty + 1})">+</button>
          </div>
          <div class="item-price">${money(item.lineTotal)}</div>
          <button class="remove-btn" title="Remove" onclick="removeItem('${item.id}')">×</button>
        </div>
      `).join('');

      const breakdownRowsHTML = items.map(item => `
        <div class="total-row">
          <span>${item.name}${item.qty > 1 ? ' × ' + item.qty : ''}</span>
          <span>${money(item.origLineTotal)}</span>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="student-banner">
          <div class="banner-badge">-20% OFF</div>
          <div>Student discount applied with your valid student number!</div>
        </div>

        <div class="card">
          <div class="card-head">Order Summary</div>
          <div class="card-body">${orderItemsHTML}</div>
        </div>

        <div class="card">
          <div class="card-head">Delivery / Pickup</div>
          <div class="card-body">
            <div class="del-grid">
              <div class="del-opt ${state.delivery === 'pickup' ? 'active' : ''}" onclick="setDelivery('pickup')">
                <div class="del-name">Campus Pickup</div>
                <div class="del-desc">ICT Reception</div>
                <div class="del-price">FREE</div>
              </div>
              <div class="del-opt ${state.delivery === 'courier' ? 'active' : ''}" onclick="setDelivery('courier')">
                <div class="del-name">Delivery</div>
                <div class="del-desc">Standard courier</div>
                <div class="del-price">FREE</div>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-head">Payment Method</div>
          <div class="card-body">
            <div class="pay-row">
              <button class="pay-opt ${state.payment === 'YOCO' ? 'active' : ''}" onclick="setPayment('YOCO')">YOCO</button>
              <button class="pay-opt ${state.payment === 'SnapScan' ? 'active' : ''}" onclick="setPayment('SnapScan')">SnapScan</button>
              <button class="pay-opt ${state.payment === 'EFT' ? 'active' : ''}" onclick="setPayment('EFT')">EFT</button>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-head">Price Breakdown</div>
          <div class="card-body">
            ${breakdownRowsHTML}
            <div class="total-row"><span>Subtotal</span><span>${money(subtotal)}</span></div>
            <div class="total-row discount">
              <span>Student Discount <span class="disc-badge">-20%</span></span>
              <span>-${money(discountAmount)}</span>
            </div>
            <div class="total-row final"><span>Total</span><span>${money(total)}</span></div>
          </div>
        </div>

        <button class="order-btn" onclick="placeOrder()">Place Order — ${money(total)}</button>
      `;
    }

    // Keep in sync if cart changes in another tab (e.g. products.html)
    window.addEventListener('storage', (e) => {
      if (e.key === CART_KEY && !state.confirmation) render();
    });

    render();
  </script>

</body>
</html>
