<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ICT Branded – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy:   #101D56;
      --orange: #FF751F;
      --teal:   #0097B2;
      --grey:   #f4f6fb;
      --border: #dde2f0;
      --text:   #101D56;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Source Sans 3', sans-serif;
      background: var(--navy);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 32px;
      background: var(--navy);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .nav-logo { font-size: 20px; font-weight: 900; color: #fff; letter-spacing: .3px; }
    .nav-logo span { color: var(--orange); }
    .nav-tagline { font-size: 13px; font-weight: 700; color: var(--teal); letter-spacing: 1.5px; }

    /* ── PAGE BODY ── */
    .page-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    /* ── CARD ── */
    .card {
      background: #fff;
      border-radius: 18px;
      width: 100%;
      max-width: 480px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.35);
      animation: slideUp .45s cubic-bezier(.22,.68,0,1.2) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-accent { height: 5px; background: var(--orange); }

    .card-inner { padding: 32px 36px 36px; }

    /* ── LOGO ROW ── */
    .logo-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }
    .logo-img {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
    }
    .logo-placeholder {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--navy);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-placeholder svg { width: 28px; height: 28px; }
    .logo-text { font-size: 20px; font-weight: 900; color: var(--navy); line-height: 1.2; }
    .logo-text span { color: var(--orange); }

    /* ── TABS ── */
    .tabs {
      display: flex;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--navy);
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      padding: 11px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: var(--navy);
      background: #fff;
      transition: background .2s, color .2s;
      border: none;
      font-family: inherit;
    }
    .tab.active { background: var(--navy); color: #fff; }

    /* ── FORM PANELS ── */
    .form-panel { display: none; flex-direction: column; gap: 12px; }
    .form-panel.active { display: flex; }

    input {
      width: 100%;
      background: var(--grey);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 14px;
      font-family: inherit;
      color: var(--navy);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input::placeholder { color: #aab4cc; }
    input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(0,151,178,.12);
    }

    .btn-primary {
      width: 100%;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background .2s, transform .1s;
      margin-top: 4px;
    }
    .btn-primary:hover { background: #1a2d7a; }
    .btn-primary:active { transform: scale(.98); }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 4px 0;
    }
    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-text { font-size: 12px; color: #aab4cc; font-weight: 700; }

    .btn-secondary {
      width: 100%;
      background: transparent;
      color: var(--teal);
      border: 2px solid var(--teal);
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .btn-secondary:hover { background: var(--teal); color: #fff; }
  </style>
</head>
<body>

  <nav>
    <div class="nav-logo">ICT <span>Branded</span></div>
    <div class="nav-tagline">CODE. CONNECT. CREATE</div>
  </nav>

  <div class="page-body">
    <div class="card">
      <div class="card-accent"></div>
      <div class="card-inner">

        <div class="logo-row">
          <div class="logo-placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0097B2" stroke-width="1.8">
              <circle cx="12" cy="12" r="10"/>
              <path d="M2 12h20M12 2a15 15 0 010 20M12 2a15 15 0 000 20"/>
            </svg>
          </div>
          <div class="logo-text">Welcome to ICT <span>Branded</span></div>
        </div>

        <div class="tabs">
          <button class="tab active" onclick="switchTab('signin', this)">Sign In</button>
          <button class="tab" onclick="switchTab('signup', this)">Sign Up</button>
        </div>

        <!-- SIGN IN -->
        <div class="form-panel active" id="signin">
          <input type="text" placeholder="Student Number"/>
          <input type="password" placeholder="Password"/>
          <button class="btn-primary">Sign In</button>
          <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-text">OR</div>
            <div class="divider-line"></div>
          </div>
          <button class="btn-secondary" onclick="switchTab('signup', document.querySelectorAll('.tab')[1])">Create an account</button>
        </div>

        <!-- SIGN UP -->
        <div class="form-panel" id="signup">
          <input type="text" placeholder="Full Name"/>
          <input type="text" placeholder="Student Number"/>
          <input type="password" placeholder="Password"/>
          <button class="btn-primary">Sign Up</button>
          <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-text">OR</div>
            <div class="divider-line"></div>
          </div>
          <button class="btn-secondary" onclick="switchTab('signin', document.querySelectorAll('.tab')[0])">Already have an account</button>
        </div>

      </div>
    </div>
  </div>

  <script>
    function switchTab(id, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      document.getElementById(id).classList.add('active');
    }
  </script>

</body>
</html>
