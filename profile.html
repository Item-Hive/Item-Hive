<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ICT Branded – My Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy:   #101D56;
      --orange: #FF751F;
      --teal:   #0097B2;
      --grey:   #f4f6fb;
      --border: #dde2f0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Source Sans 3', sans-serif;
      background: var(--grey);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav {
      background: var(--navy);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 28px;
      position: sticky; top: 0; z-index: 10;
    }
    .nav-logo { font-size: 18px; font-weight: 900; color: #fff; }
    .nav-logo span { color: var(--orange); }
    .nav-tag { color: var(--teal); font-size: 13px; font-weight: 700; letter-spacing: 1px; }

    /* ── PROFILE HEADER ── */
    .profile-header {
      background: var(--navy);
      padding: 28px 28px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: var(--orange);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 900; color: #fff;
      border: 3px solid rgba(255,255,255,.2);
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
    }
    .profile-name { color: #fff; font-size: 20px; font-weight: 900; }
    .profile-id   { color: var(--teal); font-size: 13px; font-weight: 600; }

    /* ── PAGE BODY ── */
    .page-body {
      max-width: 620px;
      margin: 0 auto;
      width: 100%;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── SECTION CARD ── */
    .section-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 2px 10px rgba(16,29,86,.05);
    }
    .section-head {
      background: var(--navy);
      color: #fff;
      padding: 11px 18px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ── ORDER ITEMS ── */
    .order-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--grey);
      transition: background .15s;
    }
    .order-item:last-child { border-bottom: none; }
    .order-item:hover { background: #fafbff; }

    .order-left { display: flex; align-items: center; gap: 12px; }
    .order-dot {
      width: 36px; height: 36px;
      border-radius: 9px;
      background: var(--teal);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 16px;
    }
    .order-dot.orange { background: var(--orange); }
    .order-num  { font-size: 13px; font-weight: 700; color: var(--navy); }
    .order-desc { font-size: 12px; color: #8892aa; margin-top: 2px; }

    .order-right { text-align: right; }
    .order-price { font-size: 14px; font-weight: 900; color: var(--navy); }

    .status-pill {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      border-radius: 20px;
      padding: 3px 10px;
      margin-top: 4px;
    }
    .status-ready      { background: #e1f5e8; color: #1a7a3a; }
    .status-processing { background: #fff5e0; color: #b07a00; }

    /* ── ACCOUNT ROWS ── */
    .account-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--grey);
      cursor: pointer;
      transition: background .15s;
    }
    .account-row:last-child { border-bottom: none; }
    .account-row:hover { background: #fafbff; }
    .account-label { font-size: 14px; font-weight: 600; color: var(--navy); }
    .account-arrow { color: var(--teal); font-size: 18px; font-weight: 700; }

    /* ── SIGN OUT ── */
    .signout-btn {
      width: 100%;
      background: transparent;
      border: 2px solid #e05555;
      color: #e05555;
      border-radius: 10px;
      padding: 13px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .signout-btn:hover { background: #e05555; color: #fff; }
  </style>
</head>
<body>

  <nav>
    <div class="nav-logo">ICT <span>Branded</span></div>
    <div class="nav-tag">My Profile</div>
  </nav>

  <div class="profile-header">
    <div class="avatar">OM</div>
    <div class="profile-name">Olwethu Mtwazi</div>
    <div class="profile-id">230036937 · ICT Department</div>
  </div>

  <div class="page-body">

    <!-- MY ORDERS -->
    <div class="section-card">
      <div class="section-head">My Orders</div>

      <div class="order-item">
        <div class="order-left">
          <div class="order-dot">👕</div>
          <div>
            <div class="order-num">Order #0001</div>
            <div class="order-desc">ICT Classic — Custom Print</div>
          </div>
        </div>
        <div class="order-right">
          <div class="order-price">R200</div>
          <div class="status-pill status-ready">Ready</div>
        </div>
      </div>

      <div class="order-item">
        <div class="order-left">
          <div class="order-dot orange">👚</div>
          <div>
            <div class="order-num">Order #0002</div>
            <div class="order-desc">ICT Crop Top</div>
          </div>
        </div>
        <div class="order-right">
          <div class="order-price">R130</div>
          <div class="status-pill status-processing">Processing</div>
        </div>
      </div>

    </div>

    <!-- ACCOUNT SETTINGS -->
    <div class="section-card">
      <div class="section-head">Account Settings</div>
      <div class="account-row">
        <span class="account-label">Email Address</span>
        <span class="account-arrow">›</span>
      </div>
      <div class="account-row">
        <span class="account-label">Size Preference</span>
        <span class="account-arrow">›</span>
      </div>
      <div class="account-row">
        <span class="account-label">Notifications</span>
        <span class="account-arrow">›</span>
      </div>
    </div>

    <button class="signout-btn" onclick="location.href='login.html'">Sign Out</button>

  </div>

</body>
</html>
